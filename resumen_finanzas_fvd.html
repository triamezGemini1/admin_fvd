<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FVD — Resumen finanzas del periodo</title>
    <link rel="icon" href="img/logonvofvd.ico" type="image/x-icon">
    <link rel="stylesheet" href="dist/assets/css/main.css">
</head>
<body class="admin-fvd-panel ag-fin-periodo-body ag-fvd-report-page">
    <header class="main-header">
        <div class="brand-container">
            <a href="panel.html"><img src="img/fvd-portal-logo.png" alt="Federación Venezolana de Dominó" class="main-logo"></a>
            <p class="fvd-header-title">FEDERACION VENEZOLANA DE DOMINO</p>
        </div>
        <nav id="main-nav" class="main-nav-actions">
            <a href="resultado_financiero_torneo.html" class="btn-secondary btn-sm">Resultado ing./gastos</a>
            <a href="panel.html" class="btn-secondary btn-sm">Panel</a>
            <a href="informes.html" class="btn-secondary btn-sm">Informes</a>
            <button type="button" class="btn-secondary btn-sm" id="rfvd-btn-print">Imprimir</button>
        </nav>
    </header>

    <div id="delegado-torneos-context" class="delegado-torneos-context is-hidden" aria-label="Torneos activos"></div>

    <main class="ag-fin-periodo-main">
        <div id="rfvd-gate" class="admin-gate-msg" style="display: none;"></div>
        <div id="rfvd-app" class="ag-fin-periodo-app" style="display: none;">
            <header class="ag-fin-periodo-head">
                <h1>Resumen de finanzas FVD</h1>
                <p id="rfvd-lead" class="ag-muted">Un renglón por torneo; columnas con cantidad y monto por evento.</p>
            </header>

            <div class="ag-fin-periodo-toolbar admin-toolbar">
                <label class="ag-fin-periodo-field">
                    <span>Filtrar ámbito</span>
                    <select id="rfvd-periodo" aria-label="Filtrar por campeonato"></select>
                </label>
                <button type="button" class="btn-primary btn-sm" id="rfvd-btn-cargar">Actualizar</button>
            </div>

            <section class="ag-fin-periodo-section" aria-labelledby="rfvd-h-global">
                <h2 id="rfvd-h-global">Resumen por torneo</h2>
                <p class="ag-muted ag-fin-periodo-hint">Use <strong>Ver detalles</strong> para el desglose por asociación del torneo.</p>
                <div id="rfvd-global"></div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Federación Venezolana de Dominó</p>
    </footer>
    <script type="module" src="src/js/resumen_finanzas_fvd.js"></script>
</body>
</html>
