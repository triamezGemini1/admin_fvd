<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FVD — Reporte de finanzas</title>
    <link rel="icon" href="img/logonvofvd.ico" type="image/x-icon">
    <link rel="stylesheet" href="dist/assets/css/main.css">
</head>
<body class="admin-fvd-panel ag-informe-report ag-fvd-report-page">
    <header class="main-header">
        <div class="brand-container">
            <a href="panel.html"><img src="img/fvd-portal-logo.png" alt="Federación Venezolana de Dominó" class="main-logo"></a>
            <p class="fvd-header-title">FEDERACION VENEZOLANA DE DOMINO</p>
        </div>
        <nav id="main-nav" class="main-nav-actions">
            <a href="panel.html" class="btn-secondary" style="font-size: 0.85rem; padding: 0.45rem 0.9rem;">Panel</a>
            <button type="button" class="btn-secondary" id="btn-inf-print" style="font-size: 0.85rem; padding: 0.45rem 0.9rem;">Imprimir</button>
        </nav>
    </header>
    <div id="delegado-torneos-context" class="delegado-torneos-context is-hidden" aria-label="Torneos activos"></div>
    <main id="inf-root" class="admin-panel ag-inf-page">
        <div id="inf-gate" class="admin-gate-msg" style="display: none;"></div>
        <div id="inf-app" style="display: none;">
            <div class="ag-inf-sheet ag-fvd-reporte-hoja">
                <h1 id="inf-report-title" class="ag-inf-report-title">Reporte de finanzas</h1>
                <p id="inf-report-lead" class="ag-muted ag-inf-report-lead">Cargando…</p>
                <div id="inf-body"></div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Federación Venezolana de Dominó</p>
    </footer>
    <script type="module" src="src/js/informes.js"></script>
</body>
</html>
