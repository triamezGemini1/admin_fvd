<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FVD — Recibo de pago</title>
    <link rel="icon" href="img/logonvofvd.ico" type="image/x-icon">
    <link rel="stylesheet" href="dist/assets/css/main.css">
</head>
<body class="admin-fvd-panel ag-informe-report ag-fvd-report-page">
    <header class="main-header">
        <div class="brand-container">
            <a href="panel.html"><img src="img/fvd-portal-logo.png" alt="Federación Venezolana de Dominó" class="main-logo"></a>
            <p class="fvd-header-title">FEDERACION VENEZOLANA DE DOMINO</p>
        </div>
        <nav id="main-nav" class="main-nav-actions">
            <a href="informes.html" class="btn-secondary" style="font-size: 0.85rem; padding: 0.45rem 0.9rem;">Informes</a>
            <button type="button" class="btn-secondary" id="btn-rec-print" style="font-size: 0.85rem; padding: 0.45rem 0.9rem;">Imprimir</button>
        </nav>
    </header>
    <div id="delegado-torneos-context" class="delegado-torneos-context is-hidden" aria-label="Torneos activos"></div>
    <main id="rec-root" class="admin-panel ag-inf-page">
        <div id="rec-gate" class="admin-gate-msg" style="display: none;"></div>
        <div id="rec-app" style="display: none;">
            <div class="ag-inf-sheet ag-recibo-sheet ag-fvd-reporte-hoja">
                <div id="rec-head"></div>
                <div id="rec-body"></div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Federación Venezolana de Dominó</p>
    </footer>
    <script type="module" src="src/js/informe_recibo.js"></script>
</body>
</html>
